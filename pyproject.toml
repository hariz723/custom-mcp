[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-playwright-mcp"
version = "0.1.0"
description = "Autonomous Playwright MCP server with metadata scraping, code generation, and LLM runtime self-healing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hari" }
]
dependencies = [
    "mcp>=2.3.0",
    "playwright>=1.50.0",
    "uvicorn>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
playwright-mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
